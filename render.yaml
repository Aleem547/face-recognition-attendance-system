# A free public research demo. The class clock pauses when this service sleeps.
services:
  - type: web
    name: face-recognition-attendance-system
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      # Enter the ORIGINAL runtime values privately when creating the Blueprint.
      # The application derives BETTER_AUTH_URL from RENDER_EXTERNAL_URL.
      - key: APP_DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: ATTENDAI_BIOMETRIC_KEY
        sync: false
      - key: ATTENDAI_BIOMETRICS_ENABLED
        sync: false
      - key: ATTENDAI_VERIFICATION_TRIAL_ENABLED
        sync: false
